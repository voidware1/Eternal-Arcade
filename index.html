<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Eternal Arcade</title> <style> * { margin: 0; padding: 0; box-sizing: border-box; } body { min-height: 100vh; overflow: hidden; background: #000; color: white; font-family: Arial, sans-serif; } /* ========================= PARTICLES ========================= */ #particles { position: fixed; inset: 0; overflow: hidden; pointer-events: none; } .particle { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: #a855f7; box-shadow: 0 0 8px #a855f7, 0 0 16px #7c3aed; opacity: 0; animation: floatUp linear infinite; } @keyframes floatUp { 0% { transform: translateY(110vh); opacity: 0; } 15% { opacity: .8; } 80% { opacity: .6; } 100% { transform: translateY(-10vh); opacity: 0; } } /* ========================= MAIN ========================= */ .container { position: relative; z-index: 2; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding-top: 90px; } /* ========================= MOON ========================= */ .moon { position: relative; width: 95px; height: 95px; border-radius: 50%; background: #a855f7; box-shadow: 0 0 20px rgba(168, 85, 247, .8), 0 0 60px rgba(124, 58, 237, .55), 0 0 110px rgba(124, 58, 237, .25); margin-bottom: 25px; overflow: hidden; } /* Crescent cutout */ .moon::after { content: ""; position: absolute; width: 95px; height: 95px; border-radius: 50%; background: #000; left: 30px; top: -13px; } /* ========================= TITLE ========================= */ .title { font-size: 42px; font-weight: 700; letter-spacing: -1.5px; text-align: center; margin-bottom: 32px; text-shadow: 0 0 15px rgba(168, 85, 247, .35); } /* ========================= LIQUID SEARCH ========================= */ .search { position: relative; width: min(600px, 85vw); height: 58px; border-radius: 22px; display: flex; align-items: center; padding: 0 20px; background: linear-gradient( 135deg, rgba(255,255,255,.08), rgba(168,85,247,.06) ); border: 1px solid rgba(255,255,255,.13); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); box-shadow: inset 0 1px 1px rgba(255,255,255,.12), 0 10px 40px rgba(0,0,0,.5); transition: .25s; } /* Glass reflection */ .search::before { content: ""; position: absolute; left: 12%; right: 12%; top: 1px; height: 1px; background: linear-gradient( 90deg, transparent, rgba(255,255,255,.3), transparent ); } /* Purple glow */ .search:focus-within { border-color: rgba(168,85,247,.5); box-shadow: inset 0 1px 1px rgba(255,255,255,.12), 0 0 30px rgba(168,85,247,.15), 0 10px 40px rgba(0,0,0,.5); } /* Search icon */ .search-icon { font-size: 19px; color: #a855f7; margin-right: 12px; } /* Input */ .search input { width: 100%; border: none; outline: none; background: transparent; color: white; font-size: 15px; } .search input::placeholder { color: rgba(255,255,255,.42); } /* ========================= MOBILE ========================= */ @media(max-width: 600px) { .container { padding-top: 70px; } .moon { width: 80px; height: 80px; } .moon::after { width: 80px; height: 80px; } .title { font-size: 34px; } } </style> </head> <body> <!-- PARTICLES --> <div id="particles"></div> <!-- MAIN --> <div class="container"> <!-- PURPLE MOON --> <div class="moon"></div> <!-- TITLE --> <h1 class="title"> Eternal Arcade </h1> <!-- SEARCH --> <div class="search"> <span class="search-icon"> ⌕ </span> <input type="text" placeholder="Search games..." autocomplete="off" > </div> </div> <script> /* ========================= PARTICLES ========================= */ const particles = document.getElementById("particles"); for (let i = 0; i < 70; i++) { const particle = document.createElement("div"); particle.className = "particle"; particle.style.left = Math.random() * 100 + "vw"; particle.style.animationDuration = (8 + Math.random() * 15) + "s"; particle.style.animationDelay = (-Math.random() * 20) + "s"; const size = 1 + Math.random() * 3; particle.style.width = size + "px"; particle.style.height = size + "px"; particles.appendChild(particle); } </script> </body> </html>
