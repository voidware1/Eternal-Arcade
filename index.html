```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Eternal Arcade</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    min-height: 100vh;
    overflow-x: hidden;
    overflow-y: auto;

    background: #000;
    color: white;

    font-family: Arial, sans-serif;
}


/* =========================
   PARTICLES
========================= */

#particles {
    position: fixed;
    inset: 0;

    overflow: hidden;
    pointer-events: none;

    z-index: 0;
}

.particle {
    position: absolute;

    width: 3px;
    height: 3px;

    border-radius: 50%;

    background: #a855f7;

    box-shadow:
        0 0 8px #a855f7,
        0 0 16px #7c3aed;

    opacity: 0;

    animation: floatUp linear infinite;
}

@keyframes floatUp {

    0% {
        transform: translateY(110vh);
        opacity: 0;
    }

    15% {
        opacity: .8;
    }

    80% {
        opacity: .6;
    }

    100% {
        transform: translateY(-10vh);
        opacity: 0;
    }

}


/* =========================
   MAIN
========================= */

.container {
    position: relative;
    z-index: 2;

    min-height: 100vh;

    display: flex;
    flex-direction: column;
    align-items: center;

    padding-top: 90px;
    padding-bottom: 100px;
}


/* =========================
   MOON
========================= */

.moon {
    position: relative;

    width: 95px;
    height: 95px;

    border-radius: 50%;

    background: #a855f7;

    box-shadow:
        0 0 20px rgba(168, 85, 247, .8),
        0 0 60px rgba(124, 58, 237, .55),
        0 0 110px rgba(124, 58, 237, .25);

    margin-bottom: 25px;

    overflow: hidden;
}

.moon::after {
    content: "";

    position: absolute;

    width: 95px;
    height: 95px;

    border-radius: 50%;

    background: #000;

    left: 30px;
    top: -13px;
}


/* =========================
   TITLE
========================= */

.title {
    font-size: 42px;
    font-weight: 700;

    letter-spacing: -1.5px;

    text-align: center;

    margin-bottom: 32px;

    text-shadow:
        0 0 15px rgba(168, 85, 247, .35);
}


/* =========================
   SEARCH
========================= */

.search {
    position: relative;

    width: min(600px, 85vw);
    height: 58px;

    border-radius: 22px;

    display: flex;
    align-items: center;

    padding: 0 20px;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.035),
            rgba(168,85,247,.025)
        );

    border: 1px solid rgba(255,255,255,.09);

    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);

    box-shadow:
        inset 0 1px 1px rgba(255,255,255,.08),
        0 10px 40px rgba(0,0,0,.35);

    transition: .25s;

    z-index: 5;
}

.search::before {
    content: "";

    position: absolute;

    left: 12%;
    right: 12%;
    top: 1px;

    height: 1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.3),
            transparent
        );
}

.search:focus-within {

    border-color:
        rgba(168,85,247,.5);

    box-shadow:
        inset 0 1px 1px rgba(255,255,255,.1),
        0 0 30px rgba(168,85,247,.15),
        0 10px 40px rgba(0,0,0,.5);
}

.search-icon {
    font-size: 19px;

    color: #a855f7;

    margin-right: 12px;
}

.search input {
    width: 100%;

    border: none;
    outline: none;

    background: transparent;

    color: white;

    font-size: 15px;
}

.search input::placeholder {
    color: rgba(255,255,255,.42);
}


/* =========================
   PLAY SECTION
========================= */

.play-section {

    width: min(1200px, 92vw);

    margin-top: 55px;
}

.section-title {

    font-size: 25px;

    font-weight: 700;

    margin-bottom: 22px;

    letter-spacing: -.5px;
}


/* =========================
   GAME GRID
========================= */

.game-grid {

    display: grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(150px, 1fr)
        );

    gap: 18px;
}


/* =========================
   GAME CARD
========================= */

.game-card {

    position: relative;

    aspect-ratio: 1 / 1;

    border-radius: 20px;

    overflow: hidden;

    text-decoration: none;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        linear-gradient(
            135deg,
            rgba(168,85,247,.045),
            rgba(255,255,255,.018)
        );

    border:
        1px solid rgba(255,255,255,.08);

    box-shadow:
        0 10px 35px rgba(0,0,0,.3);

    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);

    transition:
        transform .25s ease,
        border-color .25s ease,
        box-shadow .25s ease;

    cursor: pointer;
}

.game-card:hover {

    transform:
        translateY(-6px)
        scale(1.025);

    border-color:
        rgba(168,85,247,.55);

    box-shadow:
        0 15px 45px rgba(124,58,237,.25);
}


/* =========================
   GAME TITLE
========================= */

.game-name {

    position: absolute;

    inset: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    padding: 20px;

    text-align: center;

    color: white;

    font-size: 19px;

    font-weight: 700;

    line-height: 1.25;

    text-shadow:
        0 0 12px rgba(168,85,247,.8),
        0 2px 8px #000;

    transition:
        transform .25s ease,
        text-shadow .25s ease;

    pointer-events: none;
}

.game-card:hover .game-name {

    transform:
        scale(1.05);

    text-shadow:
        0 0 18px rgba(168,85,247,1),
        0 2px 8px #000;
}


/* =========================
   LOADING
========================= */

.loading {

    width: 100%;

    text-align: center;

    padding: 50px 20px;

    color: rgba(255,255,255,.45);

    font-size: 15px;
}

.loading::after {

    content: "";

    display: block;

    width: 24px;
    height: 24px;

    margin: 18px auto 0;

    border-radius: 50%;

    border:
        2px solid rgba(255,255,255,.12);

    border-top-color:
        #a855f7;

    animation:
        spin .8s linear infinite;
}

@keyframes spin {

    to {
        transform: rotate(360deg);
    }

}


/* =========================
   EMPTY
========================= */

.empty {

    width: 100%;

    text-align: center;

    padding: 50px 20px;

    color:
        rgba(255,255,255,.4);
}


/* =========================
   ERROR
========================= */

.error {

    width: 100%;

    padding: 20px;

    border-radius: 15px;

    background:
        rgba(168,85,247,.04);

    border:
        1px solid rgba(168,85,247,.12);

    color:
        rgba(255,255,255,.55);

    text-align: center;

    line-height: 1.6;

    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
}


/* =========================
   MOBILE
========================= */

@media(max-width: 600px) {

    .container {
        padding-top: 70px;
    }

    .moon {
        width: 80px;
        height: 80px;
    }

    .moon::after {
        width: 80px;
        height: 80px;
    }

    .title {
        font-size: 34px;
    }

    .play-section {
        margin-top: 45px;
    }

    .game-grid {

        grid-template-columns:
            repeat(
                2,
                minmax(0, 1fr)
            );

        gap: 12px;
    }

    .game-name {
        font-size: 16px;
    }
}

@media(min-width: 601px) and (max-width: 900px) {

    .game-grid {

        grid-template-columns:
            repeat(
                3,
                minmax(0, 1fr)
            );
    }
}

</style>
</head>


<body>

<div id="particles"></div>


<div class="container">

    <div class="moon"></div>

    <h1 class="title">
        Eternal Arcade
    </h1>


    <div class="search">

        <span class="search-icon">
            ⌕
        </span>

        <input
            id="searchInput"
            type="text"
            placeholder="Search..."
            autocomplete="off"
        >

    </div>


    <section class="play-section">

        <h2 class="section-title">
            Play
        </h2>

        <div
            id="gameGrid"
            class="game-grid"
        >

            <div class="loading">
                Loading play...
            </div>

        </div>

    </section>

</div>


<script>

/* =========================================================
   ETERNAL ARCADE
========================================================= */


/* =========================================================
   GITHUB SETTINGS
========================================================= */

const GITHUB_OWNER = "voidware1";
const GITHUB_REPO = "Eternal-Arcade";
const GITHUB_BRANCH = "main";
const PLAY_FOLDER = "play";


/* =========================================================
   ELEMENTS
========================================================= */

const gameGrid =
    document.getElementById("gameGrid");

const searchInput =
    document.getElementById("searchInput");


/* =========================================================
   GAME STORAGE
========================================================= */

let games = [];


/* =========================================================
   PARTICLES
========================================================= */

const particles =
    document.getElementById("particles");

for (let i = 0; i < 70; i++) {

    const particle =
        document.createElement("div");

    particle.className =
        "particle";

    particle.style.left =
        Math.random() * 100 + "vw";

    particle.style.animationDuration =
        (8 + Math.random() * 15) + "s";

    particle.style.animationDelay =
        (-Math.random() * 20) + "s";

    const size =
        1 + Math.random() * 3;

    particle.style.width =
        size + "px";

    particle.style.height =
        size + "px";

    particles.appendChild(particle);
}


/* =========================================================
   CLEAN GAME NAME
========================================================= */

function cleanFileName(name) {

    return name
        .replace(/\.html$/i, "")
        .replace(/[-_]+/g, " ")
        .replace(/\b\w/g, char =>
            char.toUpperCase()
        );

}


/* =========================================================
   GET GAME INFO
   DETECTS TITLE FROM THE ACTUAL GAME HTML
========================================================= */

async function getGameInfo(file) {

    const gameUrl =
        "play/" +
        encodeURIComponent(file.name);

    let title =
        cleanFileName(file.name);

    try {

        /*
         * Fetch the actual game HTML
         */

        const response =
            await fetch(
                file.download_url
            );

        if (!response.ok) {

            throw new Error(
                "Could not fetch game HTML"
            );

        }


        const html =
            await response.text();


        /*
         * Parse the game HTML
         */

        const doc =
            new DOMParser().parseFromString(
                html,
                "text/html"
            );


        /*
         * Find the actual <title>
         */

        const pageTitle =
            doc.querySelector("title");


        if (pageTitle) {

            const detectedTitle =
                pageTitle.textContent.trim();


            /*
             * Only use the detected title
             * if it is actually useful.
             */

            if (
                detectedTitle &&
                detectedTitle.toLowerCase() !== "game" &&
                detectedTitle.toLowerCase() !== "untitled"
            ) {

                title =
                    detectedTitle;

            }

        }


        console.log(
            "Game:",
            file.name
        );

        console.log(
            "Detected title:",
            title
        );

    } catch (error) {

        /*
         * If the game cannot be inspected,
         * the filename title remains.
         */

        console.warn(
            "Could not inspect game:",
            file.name,
            error
        );

    }


    return {

        name:
            title,

        fileName:
            file.name,

        url:
            gameUrl

    };

}


/* =========================================================
   LOAD PLAY LIBRARY
========================================================= */

async function loadGames() {

    try {

        gameGrid.innerHTML = `
            <div class="loading">
                Loading play...
            </div>
        `;


        const apiURL =
            `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${PLAY_FOLDER}?ref=${GITHUB_BRANCH}`;


        const response =
            await fetch(apiURL);


        if (!response.ok) {

            throw new Error(
                "GitHub API request failed: " +
                response.status
            );

        }


        const files =
            await response.json();


        /*
         * Only HTML game files
         */

        const gameFiles =
            files.filter(file => {

                return (

                    file.type === "file" &&

                    file.name
                        .toLowerCase()
                        .endsWith(".html") &&

                    file.name
                        .toLowerCase() !==
                        "index.html"

                );

            });


        /*
         * Read every game page
         * to get its actual title.
         */

        games =
            await Promise.all(
                gameFiles.map(
                    file =>
                        getGameInfo(file)
                )
            );


        /*
         * Render games
         */

        renderGames();


    } catch (error) {

        console.error(
            "Library error:",
            error
        );


        gameGrid.innerHTML = `
            <div class="error">

                Could not load the game library.

                <br><br>

                ${escapeHtml(error.message)}

            </div>
        `;

    }

}


/* =========================================================
   RENDER GAMES
========================================================= */

function renderGames() {

    const search =
        searchInput.value
            .trim()
            .toLowerCase();


    const filtered =
        games.filter(game => {

            return (

                game.name
                    .toLowerCase()
                    .includes(search)

                ||

                game.fileName
                    .toLowerCase()
                    .includes(search)

            );

        });


    if (!filtered.length) {

        gameGrid.innerHTML = `
            <div class="empty">
                No results found.
            </div>
        `;

        return;

    }


    gameGrid.innerHTML =
        filtered.map(game => {

            return `

                <a
                    class="game-card"
                    href="${escapeAttribute(game.url)}"
                    aria-label="${escapeAttribute(game.name)}"
                >

                    <div class="game-name">
                        ${escapeHtml(game.name)}
                    </div>

                </a>

            `;

        }).join("");

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================================================
   ESCAPE ATTRIBUTE
========================================================= */

function escapeAttribute(value) {

    return escapeHtml(value);

}


/* =========================================================
   SEARCH
========================================================= */

searchInput.addEventListener(
    "input",
    renderGames
);


/* =========================================================
   START
========================================================= */

loadGames();

</script>

</body>
</html>
