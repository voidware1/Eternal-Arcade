<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    min-height: 100%;
}

body {
    font-family: Arial, sans-serif;
    color: #f5f0ff;
    background:
        radial-gradient(
            circle at 50% -10%,
            rgba(125,45,220,.28),
            transparent 40%
        ),
        #050308;
    overflow-x: hidden;
}

.container {
    width: min(1200px, calc(100% - 24px));
    margin: auto;
    padding-bottom: 60px;
}

.glass {
    background: rgba(16,10,23,.68);
    border: 1px solid rgba(155,77,255,.28);
    box-shadow:
        0 15px 50px rgba(0,0,0,.45),
        inset 0 1px rgba(255,255,255,.05),
        0 0 35px rgba(112,35,180,.08);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 20px;
}

.ad {
    margin: 12px 0;
    overflow: hidden;
    min-height: 90px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.ad iframe {
    width: 100%;
    height: 90px;
    border: 0;
}

.game-panel {
    padding: 10px;
}

#gameFrame {
    width: 100%;
    height: 75vh;
    min-height: 500px;
    display: block;
    border: 0;
    border-radius: 14px;
    background: #000;
}

.controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    padding: 14px 4px 4px;
}

button {
    border: 1px solid rgba(174,108,255,.35);
    color: white;
    background:
        linear-gradient(
            135deg,
            rgba(155,77,255,.35),
            rgba(103,33,198,.16)
        );
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    padding: 12px 18px;
    border-radius: 13px;
    cursor: pointer;
    font-weight: bold;
    transition: .2s;
}

button:hover {
    transform: translateY(-2px);
    border-color: rgba(190,130,255,.75);
    box-shadow: 0 0 25px rgba(155,77,255,.25);
}

.section-title {
    margin: 32px 4px 15px;
}

.play-more {
    display: grid;
    grid-template-columns:
        repeat(auto-fill, minmax(145px, 1fr));
    gap: 15px;
}

.game-card {
    position: relative;
    aspect-ratio: 1 / 1;
    overflow: hidden;
    border-radius: 17px;
    border: 1px solid rgba(155,77,255,.25);
    background: rgba(16,10,23,.72);
    cursor: pointer;
    text-decoration: none;
    color: white;
    transition: .25s;
}

.game-card:hover {
    transform: translateY(-5px) scale(1.02);
    border-color: rgba(170,100,255,.75);
    box-shadow: 0 10px 35px rgba(155,77,255,.2);
}

.game-card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: .25s;
}

.game-card:hover img {
    opacity: .08;
    transform: scale(1.08);
}

.game-title {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 15px;
    font-weight: bold;
    opacity: 0;
    transition: .25s;
}

.game-card:hover .game-title {
    opacity: 1;
}

.fallback {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 45px;
    color: #9b4dff;
}

.loading {
    color: #93889f;
    padding: 20px 4px;
}

@media (max-width: 700px) {

    #gameFrame {
        height: 65vh;
        min-height: 400px;
    }

    .ad iframe {
        height: 70px;
    }

    .play-more {
        grid-template-columns: repeat(2, 1fr);
    }
}
</style>
</head>

</div>
<section class="glass game-panel">
<iframe id="gameFrame" title="Game"></iframe>
<div class="controls">
<button onclick="fullscreenGame()">⛶ Fullscreen</button>

const CURRENT_GAME = "1v1lol.html";

function decodeGame() {

    const binary = atob(GAME_DATA);

    const bytes =
        new Uint8Array(binary.length);

    for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
    }

    return new TextDecoder().decode(bytes);
}

const gameHTML = decodeGame();

const gameBlob = new Blob(
    [gameHTML],
    { type: "text/html" }
);

const gameURL =
    URL.createObjectURL(gameBlob);

document.getElementById("gameFrame").src =

function fullscreenGame() {

    const frame =
        document.getElementById("gameFrame");

    if (frame.requestFullscreen) {
        frame.requestFullscreen();
    } else if (frame.webkitRequestFullscreen) {
        frame.webkitRequestFullscreen();
    }
}


function openAboutBlank() {

    const win =
        window.open("about:blank", "_blank");

    if (!win) {

        alert(
            "Your browser blocked the new tab. Allow pop-ups for this site."
        );

        return;
    }

    win.document.open();
    win.document.write(gameHTML);
    win.document.close();
}


const API =
    "https://api.github.com/repos/voidware1/Eternal-Arcade/contents/play?ref=main";


async function loadPlayMore() {

    const container =
        document.getElementById("playMore");

    try {

        const response =
            await fetch(API);

        if (!response.ok) {
            throw new Error("GitHub API error");
        }

        const files =
            await response.json();

        const games =
            files.filter(function(file) {

                return (
                    file.type === "file" &&
                    file.name.toLowerCase().endsWith(".html") &&
                    file.name !== "index.html" &&
                    file.name !== CURRENT_GAME
                );

            });

        if (!games.length) {

            container.innerHTML =
                '<div class="loading">No other games found.</div>';

            return;
        }

        container.innerHTML = "";

        for (
            const file of games.slice(0, 24)
        ) {

            const card =
                document.createElement("a");

            card.className = "game-card";

            card.href =
                "play/" +
                encodeURIComponent(file.name);

            const icon =
                await getGameIcon(
                    file.download_url
                );

            if (icon) {

                const img =
                    document.createElement("img");

                img.src = icon;
                img.alt = "";

                card.appendChild(img);

            } else {

                const fallback =
                    document.createElement("div");

                fallback.className = "fallback";
                fallback.textContent = "🎮";

                card.appendChild(fallback);
            }

            const title =
                document.createElement("div");

            title.className = "game-title";

            title.textContent =
                cleanFilename(file.name);

            try {

                const gameResponse =
                    await fetch(file.download_url);

                const gameHTML =
                    await gameResponse.text();

                const doc =
                    new DOMParser()
                        .parseFromString(
                            gameHTML,
                            "text/html"
                        );

                if (doc.title.trim()) {
                    title.textContent =
                        doc.title.trim();
                }

            } catch (error) {
                console.log(
                    "Could not read title:",
                    error
                );
            }

            card.appendChild(title);

            container.appendChild(card);
        }

    } catch (error) {

        console.error(error);

        container.innerHTML =
            '<div class="loading">Unable to load games.</div>';
    }
}


async function getGameIcon(url) {
    try {
        const response = await fetch(url);

        if (!response.ok) {
            return null;
        }

        const html = await response.text();

        const doc = new DOMParser().parseFromString(
            html,
            "text/html"
        );

        /*
         * UGS commonly has:
         *
         * <base href="https://cdn.../game/">
         *
         * followed by:
         *
         * <link rel="icon" href="icons/icon-512x512.png">
         */

        const baseElement = doc.querySelector("base");

        let baseURL = url;

        if (baseElement) {
            const baseHref =
                baseElement.getAttribute("href");

            if (baseHref) {
                baseURL =
                    new URL(
                        baseHref,
                        url
                    ).href;
            }
        }

        const icons = Array.from(
            doc.querySelectorAll(
                'link[rel~="icon"], link[rel="shortcut icon"]'
            )
        );

        if (!icons.length) {
            return null;
        }

        /*
         * Find the largest icon.
         */

        let bestIcon = null;
        let bestSize = 0;

        for (const icon of icons) {

            const href =
                icon.getAttribute("href");

            if (!href) {
                continue;
            }

            const sizes =
                icon.getAttribute("sizes") || "";

            let size = 0;

            const match =
                sizes.match(/(d+)s*xs*(d+)/i);

            if (match) {
                size =
                    Number(match[1]) *
                    Number(match[2]);
            }

            /*
             * If no size was supplied, still allow
             * the icon to be used.
             */

            if (!bestIcon || size > bestSize) {
                bestIcon = href;
                bestSize = size;
            }
        }

        if (!bestIcon) {
            return null;
        }

        /*
         * Resolve the UGS icon against its BASE URL.
         */

        const iconURL =
            new URL(
                bestIcon,
                baseURL
            ).href;

        return iconURL;

    } catch (error) {

        console.warn(
            "Icon detection failed:",
            error
        );

        return null;
    }
}


function cleanFilename(name) {

    return name
        .replace(/\.html?$/i, "")
        .replace(/[-_]+/g, " ")
        .replace(/\b\w/g, function(char) {
            return char.toUpperCase();
        });
}
