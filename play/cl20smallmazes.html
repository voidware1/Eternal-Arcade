<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="eternal-arcade" content="true">
  <meta name="eternal-theme" content="inherit">
  <title>20 Small Mazes - Eternal Arcade</title>
  <style>
    :root {
      --accent: #9b4dff;
      --accent-rgb: 155,77,255;
      --accent-light: #c79cff;
      --accent-dark: #6721c6;
      --bg: #000;
      --panel: rgba(255,255,255,.055);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: radial-gradient(circle at 50% -10%, rgba(var(--accent-rgb), .25), transparent 40%), var(--bg);
      color: white;
      font-family: Arial, Helvetica, sans-serif;
    }
    #particles {
      position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0;
    }
    .particle {
      position: absolute; width: 3px; height: 3px; border-radius: 50%;
      background: var(--accent); box-shadow: 0 0 9px rgba(var(--accent-rgb), .9);
      animation: floatParticle linear infinite;
    }
    @keyframes floatParticle {
      from { transform: translateY(110vh); opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      to { transform: translateY(-10vh); opacity: 0; }
    }
    .container {
      position: relative; z-index: 1;
      width: min(1200px, calc(100% - 24px));
      margin: auto; padding: 24px 0 60px;
    }
    .glass {
      background: linear-gradient(135deg, rgba(255,255,255,.07), rgba(255,255,255,.025));
      border: 1px solid rgba(var(--accent-rgb), .28);
      border-radius: 20px;
      backdrop-filter: blur(18px);
      box-shadow: 0 12px 45px rgba(0,0,0,.35), inset 0 1px rgba(255,255,255,.05);
    }
    .header { padding: 18px; margin-bottom: 14px; }
    .title { margin: 0; font-size: clamp(22px, 4vw, 34px); }
    .subtitle { margin-top: 7px; color: rgba(255,255,255,.6); font-size: 14px; }
    .ad { padding: 10px; margin-bottom: 14px; overflow: hidden; }
    .ad iframe {
      display: block; width: 100%; height: 90px; border: 0; border-radius: 14px; background: #000;
    }
    .game-panel { padding: 10px; }
    #gameFrame {
      display: block; width: 100%; height: 75vh; min-height: 500px;
      border: 0; border-radius: 15px; background: #000;
    }
    .controls { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
    button {
      border: 1px solid rgba(var(--accent-rgb), .35);
      background: linear-gradient(135deg, rgba(var(--accent-rgb), .22), rgba(var(--accent-rgb), .08));
      color: white; padding: 11px 16px; border-radius: 13px;
      cursor: pointer; font-weight: 600;
    }
    button:hover {
      background: linear-gradient(135deg, rgba(var(--accent-rgb), .35), rgba(var(--accent-rgb), .13));
    }
    .notice {
      margin-top: 12px; padding: 12px 14px; border-radius: 13px;
      background: rgba(var(--accent-rgb), .08); color: rgba(255,255,255,.6); font-size: 13px;
    }
    .section { margin-top: 18px; padding: 18px; }
    .section h2 { margin-top: 0; }
    .play-more {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px;
    }
    .game-card {
      display: block; min-height: 90px; padding: 15px; border-radius: 15px;
      border: 1px solid rgba(var(--accent-rgb), .22);
      background: linear-gradient(135deg, rgba(var(--accent-rgb), .10), rgba(255,255,255,.025));
      color: white; text-decoration: none;
      transition: transform .15s ease, border-color .15s ease;
    }
    .game-card:hover {
      transform: translateY(-3px);
      border-color: rgba(var(--accent-rgb), .6);
    }
    .game-card-title { font-weight: 700; line-height: 1.25; }
    .game-card-file {
      margin-top: 8px; color: rgba(255,255,255,.5); font-size: 11px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .empty { color: rgba(255,255,255,.5); }
    .report { margin-top: 16px; text-align: center; }
    .report a { color: var(--accent-light); }
    .footer { text-align: center; color: rgba(255,255,255,.4); font-size: 12px; margin-top: 30px; }
    @media (max-width: 600px) {
      #gameFrame { min-height: 400px; height: 70vh; }
      .play-more { grid-template-columns: repeat(2, minmax(0,1fr)); }
    }
  </style>
</head>

    const CURRENT_GAME = "cl20smallmazes.html";

    function escapeHTML(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function decodeGame() {
      const binary = atob(GAME_DATA);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
      }
      return new TextDecoder().decode(bytes);
    }

    const gameHTML = decodeGame();

    function loadGame() {
      document.getElementById("gameFrame").srcdoc = gameHTML;
    }

    function goHome() {
      window.location.href = "../";
    }

    function fullscreenGame() {
      const frame = document.getElementById("gameFrame");
      if (frame.requestFullscreen) {
        frame.requestFullscreen();
      } else if (frame.webkitRequestFullscreen) {
        frame.webkitRequestFullscreen();
      }
    }

    function openAboutBlank() {
      const win = window.open("about:blank", "_blank");
      if (!win) {
        alert("Your browser blocked the About:Blank window.");
        return;
      }
      win.document.open();
      win.document.write(gameHTML);
      win.document.close();
    }

    function createParticles() {
      const container = document.getElementById("particles");
      for (let i = 0; i < 55; i++) {
        const particle = document.createElement("div");
        particle.className = "particle";
        particle.style.left = Math.random() * 100 + "%";
        particle.style.animationDuration = (8 + Math.random() * 16) + "s";
        particle.style.animationDelay = (-Math.random() * 20) + "s";
        particle.style.opacity = (.2 + Math.random() * .8);
        container.appendChild(particle);
      }
    }

    function cleanFilename(name) {
      return name
        .replace(/\.html$/i, "")
        .replace(/[-_]+/g, " ")
        .replace(/\s+/g, " ")
        .trim()
        .replace(/\b\w/g, c => c.toUpperCase());
    }

    function cleanTitle(title) {
      return title
        .replace(/\s*-\s*(Eternal Arcade|Voidware)\s*$/i, "")
        .trim();
    }

    async function loadPlayMore() {
      const container = document.getElementById("playMore");
      try {
        const response = await fetch("https://api.github.com/repos/voidware1/Eternal-Arcade/contents/play?ref=main");
        if (!response.ok) throw new Error("GitHub API request failed (" + response.status + ")");

        const files = await response.json();
        const games = files.filter(file =>
          file.type === "file" &&
          /\.html$/i.test(file.name) &&
          file.name.toLowerCase() !== "index.html" &&
          file.name.toLowerCase() !== CURRENT_GAME
        );

        if (!games.length) {
          container.innerHTML = '<div class="empty">No other games found.</div>';
          return;
        }

        container.innerHTML = "";

        for (const file of games.slice(0, 36)) {
          const card = document.createElement("a");
          card.className = "game-card";
          card.href = "./" + encodeURIComponent(file.name);

          // Start with cleaned filename as fallback
          card.innerHTML = `
            <div class="game-card-title">${escapeHTML(cleanFilename(file.name))}</div>
            <div class="game-card-file">${escapeHTML(file.name)}</div>
          `;

          // Try to get the real title and clean it
          try {
            if (file.download_url) {
              const gameResponse = await fetch(file.download_url);
              if (gameResponse.ok) {
                const source = await gameResponse.text();
                const parser = new DOMParser();
                const doc = parser.parseFromString(source, "text/html");
                let title = doc.title.trim();
                title = cleanTitle(title);
                if (title) {
                  card.querySelector(".game-card-title").textContent = title;
                }
              }
            }
          } catch (error) {
            // Keep the filename fallback
          }

          container.appendChild(card);
        }
      } catch (error) {
        console.error(error);
        container.innerHTML = '<div class="empty">Unable to load games (API error or rate limit).</div>';
      }
    }

    const savedTheme = localStorage.getItem("eternalArcadeTheme");
    if (savedTheme) {
      try {
        const theme = JSON.parse(savedTheme);
        if (theme && typeof theme.hue === "number") {
          const hue = theme.hue;
          const saturation = theme.saturation ?? 80;
          const brightness = theme.brightness ?? 65;

          document.documentElement.style.setProperty(
            "--accent",
            `hsl(${hue}, ${saturation}%, ${brightness}%)`
          );

          const light = Math.min(90, brightness + 20);
          const dark = Math.max(20, brightness - 25);

          document.documentElement.style.setProperty(
            "--accent-light",
            `hsl(${hue}, ${saturation}%, ${light}%)`
          );
          document.documentElement.style.setProperty(
            "--accent-dark",
            `hsl(${hue}, ${saturation}%, ${dark}%)`
          );
          document.documentElement.style.setProperty(
            "--accent-rgb",
            hslToRgb(hue, saturation, brightness)
          );
        }
      } catch (error) {}
    }

    function hslToRgb(h, s, l) {
      s /= 100;
      l /= 100;
      const k = n => (n + h / 30) % 12;
      const a = s * Math.min(l, 1 - l);
      const f = n =>
        l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
      return [
        Math.round(255 * f(0)),
        Math.round(255 * f(8)),
        Math.round(255 * f(4))
      ].join(",");
    }

    const adFrame = document.getElementById("adFrame");
    window.addEventListener("message", event => {
      if (event.source !== adFrame.contentWindow) return;
      const data = event.data;
      if (!data || data.type !== "eternal-arcade-ad-resize") return;
      const height = Math.max(50, Math.min(500, Number(data.height) || 90));
      adFrame.style.height = height + "px";
    });

    adFrame.addEventListener("load", () => {
      try {
        adFrame.contentWindow.postMessage({ type: "eternal-arcade-ad-request-size" }, "*");
      } catch (error) {}
    });

    setTimeout(() => {
      try {
        adFrame.contentWindow.postMessage({ type: "eternal-arcade-ad-request-size" }, "*");
      } catch (error) {}
    }, 1200);

    createParticles();
    loadGame();
    loadPlayMore();
  </script>
